  <style id="ygntv-splash-style">
.ygntv-splash{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;overflow:hidden;background:#08090b;color:#fff;opacity:1;visibility:visible;transition:opacity .7s ease,visibility .7s ease;font-family:'DM Sans',sans-serif}.ygntv-splash.is-done{opacity:0;visibility:hidden;pointer-events:none}.ygntv-splash:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(229,69,79,.12),transparent 68%);filter:blur(18px);animation:clean-glow 4s ease-in-out infinite}.ygntv-splash__backdrop{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(229,69,79,.09),transparent 34%),linear-gradient(180deg,#090a0c,#050506 82%);animation:clean-bg 4s ease both}.ygntv-splash__vignette{position:absolute;inset:0;box-shadow:inset 0 0 130px rgba(0,0,0,.72)}.ygntv-splash__skip{position:absolute;top:24px;right:24px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(8,9,11,.8);color:#fff;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px)}.ygntv-splash__scene{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;transform:translateY(-3vh)}.ygntv-splash__logo{width:clamp(145px,36vw,205px);height:auto;filter:drop-shadow(0 0 3px rgba(255,255,255,.9)) drop-shadow(0 0 18px rgba(229,69,79,.72));animation:clean-logo 1.7s cubic-bezier(.2,.8,.2,1) both}.ygntv-splash__caption{margin-top:16px;font-family:'Space Grotesk',sans-serif;font-size:clamp(29px,8vw,48px);font-weight:700;letter-spacing:.18em;color:#fff;text-shadow:0 0 8px rgba(255,255,255,.65);animation:clean-brand 1s .48s cubic-bezier(.16,1,.3,1) both}.ygntv-splash__tag{margin-top:9px;color:rgba(255,255,255,.5);font-size:9px;letter-spacing:.32em;text-transform:uppercase;animation:clean-fade .8s .9s ease both}.ygntv-splash__progress{width:142px;height:2px;margin-top:22px;background:rgba(255,255,255,.12);overflow:hidden;border-radius:5px;animation:clean-fade .8s 1.1s ease both}.ygntv-splash__progress i{display:block;width:0;height:100%;background:#e5454f;box-shadow:0 0 8px rgba(229,69,79,.8);animation:ygntv-progress 4s linear forwards}@keyframes clean-bg{from{opacity:0}to{opacity:1}}@keyframes clean-glow{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:.8;transform:scale(1.06)}}@keyframes clean-logo{0%{opacity:0;transform:scale(.76);filter:blur(7px) drop-shadow(0 0 35px #fff)}65%{opacity:1;transform:scale(1.03);filter:blur(0) drop-shadow(0 0 3px #fff) drop-shadow(0 0 20px #e5454f)}100%{opacity:1;transform:scale(1)}}@keyframes clean-brand{from{opacity:0;transform:translateY(8px);letter-spacing:.35em}to{opacity:1;transform:translateY(0);letter-spacing:.18em}}@keyframes clean-fade{from{opacity:0}to{opacity:1}}@keyframes ygntv-progress{to{width:100%}}@media (max-width:520px){.ygntv-splash__caption{font-size:24px;letter-spacing:.14em}}@media (prefers-reduced-motion:reduce){.ygntv-splash:before,.ygntv-splash__logo,.ygntv-splash__progress i{animation:none}.ygntv-splash__progress i{width:100%}}
</style>

    <style>
      .ygntv-legacy-splash{align-items:center;background:#08090b;color:#fff;display:flex;flex-direction:column;gap:24px;height:100vh;justify-content:center;left:0;position:fixed;top:0;width:100%;z-index:99999}
      .ygntv-legacy-splash__logo{font-family:'Space Grotesk',sans-serif;font-size:clamp(48px,14vw,86px);font-weight:800;letter-spacing:-.1em;line-height:1}
      .ygntv-legacy-splash__logo span{color:#e5454f}.ygntv-legacy-splash__logo strong{color:#fff;font-size:.72em;margin-left:7px}
      .ygntv-legacy-splash__loading{align-items:center;color:rgba(255,255,255,.58);display:flex;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;gap:9px;letter-spacing:.14em;text-transform:uppercase}
      .ygntv-legacy-splash__dots{display:inline-flex;gap:4px}.ygntv-legacy-splash__dots i{animation:ygntv-legacy-dot 1.1s ease-in-out infinite;background:#e5454f;border-radius:50%;height:4px;width:4px}.ygntv-legacy-splash__dots i:nth-child(2){animation-delay:.15s}.ygntv-legacy-splash__dots i:nth-child(3){animation-delay:.3s}
      @keyframes ygntv-legacy-dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
      @media (prefers-reduced-motion:reduce){.ygntv-legacy-splash__dots i{animation:none;opacity:.8}}
    </style>
    <div class="ygntv-legacy-splash" role="status" aria-label="YGNTV loading"><div class="ygntv-legacy-splash__logo"><span>YGN</span><strong>TV</strong></div><div class="ygntv-legacy-splash__loading">Loading YGNTV <span class="ygntv-legacy-splash__dots" aria-hidden="true"><i></i><i></i><i></i></span></div></div>
    <script>(()=>{const dismiss=()=>{const s=document.querySelector('.ygntv-legacy-splash');if(!s)return;window.setTimeout(()=>{s.style.transition='opacity .35s ease';s.style.opacity='0';window.setTimeout(()=>s.remove(),400)},1200)};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',dismiss,{once:true});else dismiss()})();</script>
