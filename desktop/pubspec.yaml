name: ygntv_desktop
description: Initial Windows desktop preview for YGNTV.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  device_info_plus: ^13.3.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  flutter_web_auth_2: ^5.1.0
  http: ^1.6.0
  http_parser: ^4.1.2
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/yangon-tv-logo.png
    - assets/brand/yangon-tv-logo-transparent.svg
